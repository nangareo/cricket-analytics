name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Unit tests
        # The csv2 parser and the scoring maths — the layer that was silently
        # producing wrong numbers before it had any tests.
        run: pytest -q

  build:
    name: Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: cricket-analytics:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Dashboard starts and serves its health endpoint
        run: |
          docker run -d --name ci -p 8501:8501 cricket-analytics:ci
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8501/_stcore/health >/dev/null 2>&1; then
              echo "healthy after ${i}s"; docker rm -f ci; exit 0
            fi
            sleep 1
          done
          echo "never became healthy"; docker logs ci; docker rm -f ci; exit 1
